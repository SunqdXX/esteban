name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/check_policy.py

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.4', '26.1', '26.1.2', '26.2', '26.3']
    name: build (${{ matrix.mc }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: ./gradlew build checkHudClean -Pmc=${{ matrix.mc }} --console=plain
