import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'fabric-loom' version '1.17.20' apply false
}

def mc = (project.findProperty('mc') ?: '26.3').toString()
def modVersion = '1.4.0'

def targets = [
    '1.21.4': [loom: true, fabricApi: '0.119.4+1.21.4', platform: '1.21.4', glue: 'v1214', java: 21],
    '26.1'  : [meta: '15eef5a21b9c6457613432a235efeb8dc1f533bc', fabricApi: '0.145.1+26.1',   platform: '26.1.2', glue: 'v26', java: 25],
    '26.1.2': [meta: '50187e15f4fe9e772e617db26c58d789f9ec2b31', fabricApi: '0.155.3+26.1.2', platform: '26.1.2', glue: 'v26', java: 25],
    '26.2'  : [meta: '33c420747ce582e48dff1d8c5d8e67e5bb6257c9', fabricApi: '0.161.0+26.2',   platform: '26.2',   glue: 'v26', java: 25],
    '26.3'  : [meta: 'bc098d111a72e9f6178801544a42099bdfbb0cf2', fabricApi: '0.161.0+26.3',   platform: '26.3',   glue: 'v26', java: 25],
]
if (!targets.containsKey(mc))
    throw new GradleException("Unknown mc=${mc}. Supported: ${targets.keySet().join(', ')}")
def target = targets[mc]

def clientJar = null
def libraryJars = []

if (!target.loom) {
    def cache = new File(gradle.gradleUserHomeDir, 'caches/esteban')

    def sha1 = { File f ->
        def md = MessageDigest.getInstance('SHA-1')
        f.withInputStream { i ->
            def buf = new byte[65536]
            int n
            while ((n = i.read(buf)) > 0) md.update(buf, 0, n)
        }
        md.digest().encodeHex().toString()
    }

    def fetch = { String url, String hash, File dest ->
        if (dest.isFile() && sha1(dest) == hash)
            return dest
        if (gradle.startParameter.offline)
            throw new GradleException("Offline and missing ${dest}")
        dest.parentFile.mkdirs()
        def part = new File(dest.path + '.part')
        URI.create(url).toURL().withInputStream { i -> part.withOutputStream { o -> o << i } }
        def got = sha1(part)
        if (got != hash) {
            part.delete()
            throw new GradleException("Checksum mismatch for ${url}: got ${got}, expected ${hash}")
        }
        Files.move(part.toPath(), dest.toPath(), StandardCopyOption.REPLACE_EXISTING)
        dest
    }

    def metaFile = fetch("https://piston-meta.mojang.com/v1/packages/${target.meta}/${mc}.json",
                         target.meta, new File(cache, "versions/${mc}/${mc}.json"))
    def meta = new JsonSlurper().parse(metaFile)

    clientJar = fetch(meta.downloads.client.url, meta.downloads.client.sha1,
                      new File(cache, "versions/${mc}/client.jar"))

    libraryJars = meta.libraries
            .findAll { it.downloads?.artifact && it.name.split(':').size() == 3 }
            .collect { fetch(it.downloads.artifact.url, it.downloads.artifact.sha1,
                             new File(cache, "libraries/${it.downloads.artifact.path}")) }
            .unique()
}

def names = [common: 'esteban-common', hud: 'esteban-hud', hacks: 'esteban']

subprojects { p ->
    apply plugin: 'java'

    version = "${modVersion}+${mc}"
    group   = 'club.sunqd'
    base { archivesName = names[p.name] }

    java { toolchain { languageVersion = JavaLanguageVersion.of(target.java) } }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }

    sourceSets {
        main {
            java {
                srcDir "src/platform/${target.platform}/java"
                srcDir "src/glue/${target.glue}/java"
            }
            resources {
                srcDir "src/glue/${target.glue}/resources"
            }
        }
    }

    if (target.loom) {
        apply plugin: 'fabric-loom'
        dependencies {
            minecraft "com.mojang:minecraft:${mc}"
            mappings loom.officialMojangMappings()
            modImplementation 'net.fabricmc:fabric-loader:0.19.3'
            modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        }
    } else {
        dependencies {
            compileOnly files(clientJar)
            compileOnly files(libraryJars)
            compileOnly "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
            compileOnly 'net.fabricmc:fabric-loader:0.19.3'
            compileOnly 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
            compileOnly 'io.github.llamalad7:mixinextras-fabric:0.5.4'
        }
    }

    def nested = p.name == 'common' || target.loom ? '[]'
            : """[{"file": "META-INF/jars/esteban-common-${modVersion}+${mc}.jar"}]"""

    processResources {
        inputs.property 'mc', mc
        inputs.property 'version', p.version
        inputs.property 'jars', nested
        filesMatching('fabric.mod.json') {
            expand mc: mc, version: p.version
            filter { line -> line.replace('"jars": []', "\"jars\": ${nested}") }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-nowarn'
    }
}

configure([project(':hud'), project(':hacks')]) { p ->
    p.evaluationDependsOn(':common')
    if (target.loom) {
        dependencies {
            implementation project(path: ':common', configuration: 'namedElements')
            include project(':common')
        }
    } else {
        dependencies {
            compileOnly project(':common')
        }
        tasks.named('jar') {
            from(project(':common').tasks.named('jar')) { into 'META-INF/jars' }
        }
    }
}

def releaseJar = { Project p -> target.loom ? p.tasks.named('remapJar') : p.tasks.named('jar') }

tasks.register('checkHudClean') {
    group = 'verification'
    description = 'Fails if the hud jar or the common jar inside it can reach the hacks mod'
    def hudJar = releaseJar(project(':hud')).flatMap { it.archiveFile }
    dependsOn releaseJar(project(':hud'))
    def jdeps = project(":hud").extensions.getByType(JavaToolchainService).launcherFor { languageVersion = JavaLanguageVersion.of(target.java) }
            .map { it.metadata.installationPath.file('bin/jdeps').asFile }
    def work = layout.buildDirectory.dir('hudcheck')
    def hudProjects = [project(':hud'), project(':common')]
    doLast {
        def problems = []
        hudProjects.each { hp ->
            hp.configurations.each { c ->
                c.dependencies.withType(ProjectDependency).each { d ->
                    if (d.path == ':hacks')
                        problems << "${hp.path} depends on :hacks through ${c.name}"
                }
            }
        }

        def dir = work.get().asFile
        dir.deleteDir()
        dir.mkdirs()
        def jars = [hudJar.get().asFile]
        def outer = new ZipFile(jars[0])
        outer.entries().findAll { it.name.startsWith('META-INF/jars/') && it.name.endsWith('.jar') }.each { e ->
            def f = new File(dir, e.name.substring('META-INF/jars/'.length()))
            f.bytes = outer.getInputStream(e).bytes
            jars << f
        }
        outer.close()

        jars.each { jar ->
            def zip = new ZipFile(jar)
            zip.entries().findAll { it.name.endsWith('.class') }.each { e ->
                if (!(e.name ==~ /^club\/sunqd\/esteban\/(hud|common)\/.*/))
                    problems << "${jar.name} ships ${e.name}"
            }
            def meta = zip.getEntry('fabric.mod.json')
            if (meta != null) {
                def id = new JsonSlurper().parse(zip.getInputStream(meta)).id
                if (id == 'esteban')
                    problems << "${jar.name} carries the hacks mod id"
            }
            zip.close()

            def result = providers.exec {
                commandLine jdeps.get().absolutePath, '-verbose:class', '-filter:none', jar.absolutePath
                ignoreExitValue = true
            }
            def text = result.standardOutput.asText.get()
            if (result.result.get().exitValue != 0)
                problems << "jdeps failed on ${jar.name}: ${result.standardError.asText.get()}"
            text.eachLine { line ->
                def m = line =~ /->\s+(\S+)/
                if (m.find()) {
                    def to = m.group(1)
                    if (to.startsWith('club.sunqd.esteban.') && !(to ==~ /club\.sunqd\.esteban\.(hud|common)\..*/))
                        problems << "${jar.name} references ${to}"
                }
            }
        }

        if (problems) {
            throw new GradleException("hud is not clean:\n  " + problems.unique().join('\n  '))
        }
        println "hud clean: ${jars*.name.join(', ')}"
    }
}

project(':hud').tasks.named('build') { finalizedBy rootProject.tasks.named('checkHudClean') }
